name: GitHub Feature/Release Candidate Deploy Workflow

description: Reutiliza processos de build de imagem Docker, upload de arquivos e deploy para servidores EC2, incluindo conexão via VPN.

inputs:
  AWS_ACCESS_KEY_ID:
    required: true
    description: AWS Access Key ID
  AWS_SECRET_ACCESS_KEY:
    required: true
    description: AWS Secret Key
  AWS_REGION:
    required: true
    description: AWS Region
  AWS_S3_BUCKET:
    required: false
    description: Nome do bucket S3 para baixar arquivos (se aplicável)
  ENV_FILE_PATH:
    required: false
    description: Caminho do arquivo de ambiente no S3 (se aplicável)
  ENV_ENCRYPTION_PASSWORD:
    required: false
    description: Senha de criptografia do arquivo .env
  ECR_REGISTRY:
    required: false
    description: URL do repositório ECR
  IMAGE_NAME:
    required: false
    description: Nome da imagem no ECR
  SUPERVISOR_IMAGE_NAME:
    required: false
    description: Nome da imagem no ECR
  DOCKERFILE_PATH:
    required: false
    description: Caminho para o Dockerfile
  SUPERVISOR_DOCKERFILE_PATH:
    required: false
    description: Caminho para o Dockerfile
  BASE_IMAGE:
    required: false
    description: Imagem base (se necessário)
  SUPERVISOR_BASE_IMAGE:
    required: false
    description: Imagem base (se necessário)
  DEPLOY_FILES:
    required: false
    description: Lista de arquivos a serem empacotados para deploy
  SERVER_LIST:
    required: false
    description: Lista de servidores para deploy (JSON)
  SSH_USER:
    required: false
    description: Usuário SSH para deploy
  SSH_KEY_FILE:
    required: false
    description: Chave SSH para acessar os servidores
  OVPN_CONFIG_FILE:
    required: false
    description: Configuração do OpenVPN (se necessário)
  OVPN_CERT_PASS:
    required: false
    description: Senha do OpenVPN (se necessário)
  GITHUB_TOKEN:
    required: false
    description: Token do GitHub para criar a release
  SECRET_MANAGER_KEY:
    required: false
    description: Key do secret manager

runs:
  using: "composite"
  steps:
  - name: Baixando código do repositório
    uses: actions/checkout@v4

  - name: Buscando Última Pre-Release do GitHub via API
    id: find-pre-release
    shell: bash
    run: |
      echo "Buscando a última pre-release..."

      TAG=$(curl -s -H "Authorization: Bearer ${{ inputs.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" | \
            jq -r '[.[] | select(.prerelease == true)] | sort_by(.created_at) | last | .tag_name')

      if [[ -z "$TAG" || "$TAG" == "null" ]]; then
        echo "Nenhuma pre-release encontrada! Continuando sem pré-release..."
        TAG=""
      fi

      echo "TAG_PRERELEASE=$TAG" >> $GITHUB_ENV
      echo "TAG=$TAG" >> $GITHUB_ENV
    env:
      GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}

  - name: Gerenciar Última Release (Latest)
    if: startsWith(github.ref, 'refs/heads/main')
    shell: bash
    run: |
      echo "Verificando a versão mais recente..."

      # Obtém a última versão latest existente
      CURRENT_LATEST=$(gh release view --json tagName --jq .tagName || echo "")

      echo "Última versão latest: ${CURRENT_LATEST}"

      # Obtém a última release estável
      TAG_LATEST=$(curl -s -H "Authorization: Bearer ${{ inputs.GITHUB_TOKEN }}" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/${{ github.repository }}/releases/latest" | \
                  jq -r '.tag_name')

      if [[ -z "$TAG_LATEST" || "$TAG_LATEST" == "null" ]]; then
        echo "Nenhuma release estável encontrada!"
        TAG_LATEST=""
      fi

      # Pega a versão mais recente disponível (pre-release tem prioridade)
      TAG="${TAG_PRERELEASE:-$TAG_LATEST}"

      if [[ -z "$TAG" ]]; then
        echo "Nenhuma versão válida encontrada! Saindo..."
        exit 1
      fi

      # Função para comparar versões (considerando SemVer)
      function version_greater_or_equal() {
        printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1 | grep -q "^$1$"
      }

      # Se a nova versão for maior ou igual à latest, atualiza a tag latest
      if version_greater_or_equal "${TAG}" "${CURRENT_LATEST}"; then
        echo "A versão ${TAG} é mais recente que ${CURRENT_LATEST}. Atualizando latest..."
        gh release edit "${TAG}" --prerelease=false --latest
      else
        echo "A versão ${TAG} é mais antiga que ${CURRENT_LATEST}. Apenas removendo pré-release."
        gh release edit "${TAG}" --prerelease=false
      fi

      # Define a variável TAG no ambiente para os próximos steps
      echo "TAG=${TAG}" >> $GITHUB_ENV
    env:
      GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}

  - name: Configurando credenciais da AWS
    uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: ${{ inputs.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ inputs.AWS_SECRET_ACCESS_KEY }}
      aws-region: ${{ inputs.AWS_REGION }}

  - name: Baixando arquivo .env (se aplicável)
    if: ${{ inputs.AWS_S3_ENVFILES_BUCKET != '' && inputs.ENV_FILE_PATH != '' }}
    run: |
      aws s3 cp s3://${{ inputs.AWS_S3_ENVFILES_BUCKET }}/${{ inputs.ENV_FILE_PATH }} /tmp/env
    shell: bash

  - name: Obtendo secret do Secret Manager
    if: ${{ inputs.SECRET_MANAGER_KEY != '' }}
    uses: t-botz/aws-secrets-manager-read-action@45282af736fa0ae7e0559ed105b42538344cb864
    with:
      secret-id: ${{ inputs.SECRET_MANAGER_KEY }}
      mask-json-values: true
      append-to-env-file: /tmp/env

  - name: Criptografando arquivo env com senha
    if: ${{ inputs.ENV_ENCRYPTION_PASSWORD != '' }}
    run: |
      # gpg -d --batch --passphrase "${{ inputs.ENV_ENCRYPTION_PASSWORD }}" /tmp/env.gpg > .env
      gpg -c --batch --cipher-algo AES256 --passphrase "${{ inputs.ENV_ENCRYPTION_PASSWORD }}" /tmp/env
    shell: bash

  # ##################  PUBLISH IMAGE # ##################

  - name: Adicionando Github Token ao Composer
    run: |
      cat <<-EOF > auth.json
      {
          "github-oauth": {
              "github.com": "${{ inputs.GITHUB_TOKEN }}"
          }
      }
      EOF
    shell: bash

  - name: Autenticando no ECR (se aplicável)
    if: ${{ inputs.ECR_REGISTRY != '' }}
    uses: docker/login-action@v3
    with:
      registry: ${{ inputs.ECR_REGISTRY }}

  - name: Gerando Tags e Labels para usar na imagem
    id: meta
    uses: docker/metadata-action@v4
    with:
      images: ${{ inputs.ECR_REGISTRY }}/${{ inputs.IMAGE_NAME }}
      flavor: latest=true
      tags: |
        type=raw,value=${{ env.TAG }}
        type=sha,format=long,prefix=
      labels: |
        org.opencontainers.image.version=${{ env.TAG }}

  - name: Build e Push da Imagem Docker (se aplicável)
    if: ${{ inputs.DOCKERFILE_PATH != '' }}
    uses: docker/build-push-action@v3
    with:
      context: .
      file: ${{ inputs.DOCKERFILE_PATH }}
      tags: |
        ${{ inputs.ECR_REGISTRY }}/${{ inputs.IMAGE_NAME }}:${{ env.TAG }}
        ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      push: true
      no-cache: true
      build-args: |
        IMAGE=${{ inputs.BASE_IMAGE }}

  # ##################  DEPLOY IMAGE # ##################

  - name: Criando e Armazenando Artefato de Deploy (se aplicável)
    if: ${{ inputs.DEPLOY_FILES != '' }}
    run: |
      mkdir -p /tmp/deploy
      set -f

      for file in ${{ inputs.DEPLOY_FILES }}; do
        echo "Copiando $file para /tmp/deploy/"
        DEST_DIR="/tmp/deploy/$(dirname "$file")"
        mkdir -p "$DEST_DIR"
        cp "$file" "$DEST_DIR/" || { echo "Erro ao copiar $file"; exit 1; }
      done

      tar -czf /tmp/deploy.tar.gz -C /tmp/ deploy/
    shell: bash

  - name: Armazenando arquivo de Deploy
    uses: actions/upload-artifact@v4
    with:
      name: deploy
      path: /tmp/deploy.tar.gz
      if-no-files-found: error
      retention-days: 1

  - name: Buscando IPs das EC2 com nome específico
    id: find-ec2
    shell: bash
    run: |
      echo "Buscando instâncias EC2 com nome contendo ${{ inputs.SERVER_LIST }} ..."

      INSTANCE_INFO=$(aws ec2 describe-instances \
        --region ${{ inputs.AWS_REGION }} \
        --filters "Name=tag:Name,Values=*${{ inputs.SERVER_LIST }}*" "Name=instance-state-name,Values=running" \
        --query "Reservations[].Instances[].{InstanceId:InstanceId,PublicIpAddress:PublicIpAddress}" \
        --output json)

      echo "Dados das instâncias encontradas: $INSTANCE_INFO"

      INSTANCE_IDS=$(echo "$INSTANCE_INFO" | jq -r '.[] | .InstanceId')
      IP_ADDRESSES=$(echo "$INSTANCE_INFO" | jq -r '.[] | .PublicIpAddress' | grep -v null)

      if [[ -z "$IP_ADDRESSES" ]]; then
        echo "::error::Nenhuma instância ativa com IP público encontrada."
        exit 1
      fi

      echo "Instâncias encontradas:"
      echo "$INSTANCE_IDS"
      echo "IPs encontrados:"
      echo "$IP_ADDRESSES"

      # Exporta os IPs para serem usados nos próximos steps
      echo "EC2_IPS=$(echo "$IP_ADDRESSES" | tr '\n' ' ')" >> $GITHUB_ENV

  - name: Instalando OpenVPN
    shell: bash
    run: |
      sudo apt-get update
      sudo apt-get install openvpn -y

  - name: Configurando a VPN (se necessário)
    if: ${{ inputs.OVPN_CONFIG_FILE != '' }}
    shell: bash
    run: |
      echo "${{ inputs.OVPN_CERT_PASS }}" > vpn_pass.txt
      echo "${{ inputs.OVPN_CONFIG_FILE }}" > cicd.ovpn

      # Adiciona todas as rotas dos servidores no arquivo de configuração
      for IP in $EC2_IPS; do
        echo "route $IP 255.255.255.255" >> cicd.ovpn
      done

      echo "route-nopull" >> cicd.ovpn

      sudo openvpn --config cicd.ovpn --askpass vpn_pass.txt --daemon
      sleep 5

      # Verificação da VPN
      if ! ip address | grep -q " tun"; then
        echo "::error::Interface da VPN não encontrada!"
        exit 1
      fi

  - name: Salvando chave SSH
    shell: bash
    run: |
      echo "${{ inputs.SSH_KEY_FILE }}" > ssh_key.pem
      chmod 600 ssh_key.pem

  - name: Baixando artefato de Deploy
    uses: actions/download-artifact@v4
    with:
      name: deploy

  - name: Copiando o arquivo de Deploy para as instâncias EC2
    shell: bash
    run: |
      # Verifica se a variável EC2_IPS está definida
      if [ -z "$EC2_IPS" ]; then
        echo "Erro: Nenhum IP de instância EC2 foi fornecido."
        exit 1
      fi

      # Verifica se o arquivo deploy.tar.gz existe antes de copiar
      if [ ! -f "deploy.tar.gz" ]; then
        echo "Erro: O arquivo deploy.tar.gz não foi encontrado."
        exit 1
      fi

      # Define as opções do SCP para maior segurança e eficiência
      SCP_OPTIONS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ssh_key.pem"

      for IP in $EC2_IPS; do
        echo "Copiando deploy.tar.gz para $IP..."
        
        # Tenta copiar o arquivo e verifica se teve sucesso
        if scp $SCP_OPTIONS deploy.tar.gz ${{ inputs.SSH_USER }}@$IP:/tmp/; then
          echo "Arquivo copiado com sucesso para $IP."
        else
          echo "Erro ao copiar para $IP. Verifique a conexão SSH."
          exit 1
        fi
      done

      echo "Cópia finalizada para todas as instâncias EC2."

  - name: Criar lista de IPs formatada
    shell: bash
    run: |
      if [[ $(echo ${{ env.EC2_IPS }} | wc -w) -gt 1 ]]; then
        # Se houver mais de um IP, substitui espaços por vírgula
        echo "EC2_IPS_COMMA=$(echo ${{ env.EC2_IPS }} | sed 's/ /,/g')" >> $GITHUB_ENV
      else
        # Se houver apenas um IP, mantém como está
        echo "EC2_IPS_COMMA=${{ env.EC2_IPS }}" >> $GITHUB_ENV
      fi

  - name: Executando comandos remotos nas instâncias EC2 por nome
    shell: bash
    run: |
      IFS=' ' read -r -a IPS <<< "${EC2_IPS}"
      IFS=' ' read -r -a NAMES <<< "${{ inputs.SERVER_LIST }}"

      if [ "${#IPS[@]}" -ne "${#NAMES[@]}" ]; then
        echo "::error::Quantidade de IPs e nomes de instância não correspondem!"
        exit 1
      fi

      for i in "${!IPS[@]}"; do
        IP="${IPS[$i]}"
        NAME="${NAMES[$i]}"
        echo "Conectando na instância: $NAME ($IP)..."

        COMPOSE_PATH=""
        BRANCH_NAME="${{ env.TAG }}"

        if [[ "$BRANCH_NAME" == rc* ]]; then
          COMPOSE_PATH="/tmp/deploy/.infra/homol/docker-compose.yml"
        elif [[ "$BRANCH_NAME" == main* ]]; then
          if [[ "$NAME" == *celery* ]]; then
            COMPOSE_PATH="/tmp/deploy/.infra/prod/celery/docker-compose.yml"
          elif [[ "$NAME" == *flower* ]]; then
            COMPOSE_PATH="/tmp/deploy/.infra/prod/flower/docker-compose.yml"
          elif [[ "$NAME" == *api* ]]; then
            COMPOSE_PATH="/tmp/deploy/.infra/prod/api/docker-compose.yml"
          else
            echo "::error::Instância $NAME não reconhecida para produção."
            exit 1
          fi
        else
          echo "::error::Branch inválida: $BRANCH_NAME"
          exit 1
        fi

        echo "Rodando docker-compose com arquivo: $COMPOSE_PATH"

        ssh -o StrictHostKeyChecking=no -i ssh_key.pem "${{ inputs.SSH_USER }}@$IP" \
          "set -e && \
          echo 'Descompactando deploy.tar.gz...' && \
          tar -xzf /tmp/deploy.tar.gz -C /tmp/ && \
          export GITHUB_COMMIT='${{ env.TAG }}' && \
          echo 'Atualizando Dockerfiles...' && \
          find /tmp/deploy -type f -name 'Dockerfile' -exec sed -i \"s|:latest|:\$GITHUB_COMMIT|g\" {} + && \
          echo 'Executando docker-compose...' && \
          docker-compose -f $COMPOSE_PATH up -d --build && \
          echo 'Limpando arquivos temporários...' && \
          rm -rf /tmp/deploy /tmp/deploy.tar.gz" || {
            echo "::error::Erro ao executar comandos na instância $NAME ($IP)"
            exit 1
          }

        echo "Deploy finalizado para $NAME ($IP)"
      done

  - name: Configurar permissões da chave SSH
    shell: bash
    run: chmod 600 ssh_key.pem

  - name: Encerrando a VPN (se aplicável)
    if: always() && inputs.OVPN_CONFIG_FILE != ''
    shell: bash
    run: |
      echo "Desconectando VPN..."
      sudo killall openvpn
      sleep 5

  - name: Criar PR para main se a branch for RC
    if: startsWith(github.ref, 'refs/heads/rc/')
    id: create-pr
    shell: bash
    run: |
      CURRENT_BRANCH=$(echo "${GITHUB_REF#refs/heads/}")
      echo "Branch atual: $CURRENT_BRANCH"

      PR_TITLE="[RC] branch $CURRENT_BRANCH to Main"
      PR_BODY="Pull Request RC to Main"

      echo "Verificando se a PR já existe..."

      EXISTING_PR=$(gh pr list --base main --head "$CURRENT_BRANCH" --json number --jq '.[0].number')

      if [[ -n "$EXISTING_PR" ]]; then
        echo "Pull Request já existe: #$EXISTING_PR"
        exit 0
      fi

      echo "Criando PR: $PR_TITLE"
      gh pr create --base="main" --head="$CURRENT_BRANCH" --title="$PR_TITLE" --body="$PR_BODY"
    env:
      GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}

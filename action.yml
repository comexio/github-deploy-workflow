name: GitHub Feature/Release Candidate Deploy Workflow

description: Reutiliza processos de build de imagem Docker, upload de arquivos e deploy para servidores EC2, incluindo conexão via VPN.

inputs:
  AWS_ACCESS_KEY_ID:
    required: true
    description: AWS Access Key ID
  AWS_SECRET_ACCESS_KEY:
    required: true
    description: AWS Secret Key
  AWS_REGION:
    required: true
    description: AWS Region
  AWS_S3_BUCKET:
    required: false
    description: Nome do bucket S3 para baixar arquivos
  ENV_FILE_PATH:
    required: false
    description: Caminho do arquivo de ambiente no S3
  ENV_ENCRYPTION_PASSWORD:
    required: false
    description: Senha de criptografia do arquivo .env
  ECR_REGISTRY:
    required: false
    description: URL do repositório ECR
  IMAGE_NAME:
    required: false
    description: Nome da imagem no ECR
  SUPERVISOR_IMAGE_NAME:
    required: false
    description: Nome da imagem no ECR
  DOCKERFILE_PATH:
    required: false
    description: Caminho para o Dockerfile
  SUPERVISOR_DOCKERFILE_PATH:
    required: false
    description: Caminho para o Dockerfile
  BASE_IMAGE:
    required: false
    description: Imagem base (se necessário)
  SUPERVISOR_BASE_IMAGE:
    required: false
    description: Imagem base (se necessário)
  DEPLOY_FILES:
    required: false
    description: Lista de arquivos a serem empacotados para deploy
  SERVER_LIST:
    required: false
    description: Lista de servidores para deploy (JSON)
  SSH_USER:
    required: false
    description: Usuário SSH para deploy
  SSH_KEY_FILE:
    required: false
    description: Chave SSH para acessar os servidores
  OVPN_CONFIG_FILE:
    required: false
    description: Configuração do OpenVPN (se necessário)
  OVPN_CERT_PASS:
    required: false
    description: Senha do OpenVPN (se necessário)
  GITHUB_TOKEN:
    required: false
    description: Token do GitHub para criar a release
  SECRET_MANAGER_KEY:
    required: false
    description: Key do secret manager

runs:
  using: "composite"
  steps:
  - name: Baixando código do repositório
    uses: actions/checkout@v4

  - name: Buscando Última Pre-Release do GitHub via API
    id: find-pre-release
    shell: bash
    run: |
      echo "Buscando a última pre-release..."

      TAG=$(curl -s -H "Authorization: Bearer ${{ inputs.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" | \
            jq -r '[.[] | select(.prerelease == true)] | sort_by(.created_at) | last | .tag_name')

      if [[ -z "$TAG" || "$TAG" == "null" ]]; then
        echo "Nenhuma pre-release encontrada! Continuando sem pré-release..."
        TAG=""
      fi

      echo "TAG_PRERELEASE=$TAG" >> $GITHUB_ENV
      echo "TAG=$TAG" >> $GITHUB_ENV
    env:
      GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}

  - name: Gerenciar Última Release (Latest)
    if: startsWith(github.ref, 'refs/heads/main')
    shell: bash
    run: |
      echo "Verificando a versão mais recente..."

      # Obtém a última versão latest existente
      CURRENT_LATEST=$(gh release view --json tagName --jq .tagName || echo "")

      echo "Última versão latest: ${CURRENT_LATEST}"

      # Obtém a última release estável
      TAG_LATEST=$(curl -s -H "Authorization: Bearer ${{ inputs.GITHUB_TOKEN }}" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/${{ github.repository }}/releases/latest" | \
                  jq -r '.tag_name')

      if [[ -z "$TAG_LATEST" || "$TAG_LATEST" == "null" ]]; then
        echo "Nenhuma release estável encontrada!"
        TAG_LATEST=""
      fi

      # Pega a versão mais recente disponível (pre-release tem prioridade)
      TAG="${TAG_PRERELEASE:-$TAG_LATEST}"

      if [[ -z "$TAG" ]]; then
        echo "Nenhuma versão válida encontrada! Saindo..."
        exit 1
      fi

      # Função para comparar versões (considerando SemVer)
      function version_greater_or_equal() {
        printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1 | grep -q "^$1$"
      }

      # Se a nova versão for maior ou igual à latest, atualiza a tag latest
      if version_greater_or_equal "${TAG}" "${CURRENT_LATEST}"; then
        echo "A versão ${TAG} é mais recente que ${CURRENT_LATEST}. Atualizando latest..."
        #gh release edit "${TAG}" --prerelease=false --latest
      else
        echo "A versão ${TAG} é mais antiga que ${CURRENT_LATEST}. Apenas removendo pré-release."
        #gh release edit "${TAG}" --prerelease=false
      fi

      # Define a variável TAG no ambiente para os próximos steps
      echo "TAG=${TAG}" >> $GITHUB_ENV
    env:
      GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}

  - name: Configurando credenciais da AWS
    uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: ${{ inputs.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ inputs.AWS_SECRET_ACCESS_KEY }}
      aws-region: ${{ inputs.AWS_REGION }}

  - name: Baixando arquivo .env
    if: ${{ inputs.AWS_S3_ENVFILES_BUCKET != '' && inputs.ENV_FILE_PATH != '' }}
    run: |
      aws s3 cp s3://${{ inputs.AWS_S3_ENVFILES_BUCKET }}/${{ inputs.ENV_FILE_PATH }} /tmp/env
    shell: bash

  - name: Obtendo secret do Secret Manager
    if: ${{ inputs.SECRET_MANAGER_KEY != '' }}
    uses: t-botz/aws-secrets-manager-read-action@45282af736fa0ae7e0559ed105b42538344cb864
    with:
      secret-id: ${{ inputs.SECRET_MANAGER_KEY }}
      mask-json-values: true
      append-to-env-file: /tmp/env

  - name: Criptografando arquivo env com senha
    if: ${{ inputs.ENV_ENCRYPTION_PASSWORD != '' }}
    run: |
      # gpg -d --batch --passphrase "${{ inputs.ENV_ENCRYPTION_PASSWORD }}" /tmp/env.gpg > .env
      gpg -c --batch --cipher-algo AES256 --passphrase "${{ inputs.ENV_ENCRYPTION_PASSWORD }}" /tmp/env
    shell: bash

  # ##################  PUBLISH IMAGE # ##################

  - name: Adicionando Github Token ao Composer
    run: |
      cat <<-EOF > auth.json
      {
          "github-oauth": {
              "github.com": "${{ inputs.GITHUB_TOKEN }}"
          }
      }
      EOF
    shell: bash

  # - name: Autenticando no ECR
  #   if: ${{ inputs.ECR_REGISTRY != '' }}
  #   uses: docker/login-action@v3
  #   with:
  #     registry: ${{ inputs.ECR_REGISTRY }}

  # - name: Gerando Tags e Labels para usar na imagem
  #   if: ${{ inputs.DOCKERFILE_PATH != '' }}
  #   id: meta
  #   uses: docker/metadata-action@v4
  #   with:
  #     images: ${{ inputs.ECR_REGISTRY }}/${{ inputs.IMAGE_NAME }}
  #     flavor: latest=true
  #     tags: |
  #       type=raw,value=${{ env.TAG }}
  #       type=sha,format=long,prefix=
  #     labels: |
  #       org.opencontainers.image.version=${{ env.TAG }}

  # - name: Build e Push da Imagem Docker
  #   if: ${{ inputs.DOCKERFILE_PATH != '' }}
  #   uses: docker/build-push-action@v3
  #   with:
  #     context: .
  #     file: ${{ inputs.DOCKERFILE_PATH }}
  #     tags: |
  #       ${{ inputs.ECR_REGISTRY }}/${{ inputs.IMAGE_NAME }}:${{ env.TAG }}
  #       ${{ steps.meta.outputs.tags }}
  #     labels: ${{ steps.meta.outputs.labels }}
  #     push: true
  #     no-cache: true
  #     build-args: |
  #       IMAGE=${{ inputs.BASE_IMAGE }}

  # - name: Gerando Tags e Labels para usar na imagem Supervisor
  #   if: ${{ inputs.SUPERVISOR_DOCKERFILE_PATH != '' }}
  #   id: meta_supervisor
  #   uses: docker/metadata-action@v4
  #   with:
  #     images: ${{ inputs.ECR_REGISTRY }}/${{ inputs.SUPERVISOR_IMAGE_NAME }}
  #     flavor: latest=true
  #     tags: |
  #       type=raw,value=${{ env.TAG }}
  #       type=sha,format=long,prefix=
  #     labels: |
  #       org.opencontainers.image.version=${{ env.TAG }}

  # - name: Build e Push da Imagem Docker (logos-supervisor)
  #   if: ${{ inputs.SUPERVISOR_DOCKERFILE_PATH != '' }}
  #   uses: docker/build-push-action@v3
  #   with:
  #     context: .
  #     file: ${{ inputs.SUPERVISOR_DOCKERFILE_PATH }}
  #     tags: |
  #       ${{ inputs.ECR_REGISTRY }}/${{ inputs.SUPERVISOR_IMAGE_NAME }}:${{ env.TAG }}
  #       ${{ steps.meta_supervisor.outputs.tags }}
  #     labels: ${{ steps.meta_supervisor.outputs.labels }}
  #     push: true
  #     no-cache: true
  #     build-args: |
  #       IMAGE=${{ inputs.SUPERVISOR_BASE_IMAGE }}
  # ##################  DEPLOY IMAGE # ##################

  # - name: Criando e Armazenando Artefato de Deploy
  #   if: ${{ inputs.DEPLOY_FILES != '' }}
  #   run: |
  #     mkdir -p /tmp/deploy
  #     set -f

  #     for file in ${{ inputs.DEPLOY_FILES }}; do
  #       echo "Copiando $file para /tmp/deploy/"
  #       DEST_DIR="/tmp/deploy/$(dirname "$file")"
  #       mkdir -p "$DEST_DIR"
  #       cp "$file" "$DEST_DIR/" || { echo "Erro ao copiar $file"; exit 1; }
  #     done

  #     tar -czf /tmp/deploy.tar.gz -C /tmp/ deploy/
  #   shell: bash

  - name: Criando e Armazenando Artefato de Deploy
    run: |
      set -euo pipefail

      BRANCH_NAME="${GITHUB_REF##*/}"

      if [[ "$BRANCH_NAME" == "main" ]]; then
        echo "Branch é 'main', copiando estrutura de .infra/prod"
        SOURCE_DIR=".infra/prod"
        mkdir -p /tmp/deploy/php
        mkdir -p /tmp/deploy/supervisor

        cp "$SOURCE_DIR/php/Dockerfile" /tmp/deploy/php/
        cp "$SOURCE_DIR/php/default.conf" /tmp/deploy/php/
        cp "$SOURCE_DIR/php/docker-compose.yml" /tmp/deploy/php/

        cp "$SOURCE_DIR/supervisor/Dockerfile" /tmp/deploy/supervisor/
        cp "$SOURCE_DIR/supervisor/docker-compose.yml" /tmp/deploy/supervisor/
        cp "$SOURCE_DIR/supervisor/supervisord.conf" /tmp/deploy/supervisor/

      else
        echo "Branch '$BRANCH_NAME', copiando estrutura de .infra/homol"
        SOURCE_DIR=".infra/homol"
        mkdir -p /tmp/deploy/nginx
        mkdir -p /tmp/deploy/php
        mkdir -p /tmp/deploy/supervisor

        cp "$SOURCE_DIR/nginx/default.conf" /tmp/deploy/nginx/
        cp "$SOURCE_DIR/php/Dockerfile" /tmp/deploy/php/
        cp "$SOURCE_DIR/supervisor/Dockerfile" /tmp/deploy/supervisor/
        cp "$SOURCE_DIR/supervisor/supervisord.conf" /tmp/deploy/supervisor/
        cp "$SOURCE_DIR/supervisor/docker-compose.yml" /tmp/deploy/supervisor/
      fi

      tar -czf /tmp/deploy.tar.gz -C /tmp/ deploy/
    shell: bash

  - name: Armazenando arquivo de Deploy
    uses: actions/upload-artifact@v4
    with:
      name: deploy
      path: /tmp/deploy.tar.gz
      if-no-files-found: error
      retention-days: 1

  - name: Buscando IPs das EC2 com nome específico
    id: find-ec2
    shell: bash
    run: |
      echo "Buscando instâncias EC2 com nome contendo ${{ inputs.SERVER_LIST }} ..."

      INSTANCE_INFO=$(aws ec2 describe-instances \
        --region ${{ inputs.AWS_REGION }} \
        --filters "Name=tag:Name,Values=*${{ inputs.SERVER_LIST }}*" "Name=instance-state-name,Values=running" \
        --query "Reservations[].Instances[].{InstanceId:InstanceId,PublicIpAddress:PublicIpAddress}" \
        --output json)

      echo "Dados das instâncias encontradas: $INSTANCE_INFO"

      INSTANCE_IDS=$(echo "$INSTANCE_INFO" | jq -r '.[] | .InstanceId')
      IP_ADDRESSES=$(echo "$INSTANCE_INFO" | jq -r '.[] | .PublicIpAddress' | grep -v null)

      if [[ -z "$IP_ADDRESSES" ]]; then
        echo "::error::Nenhuma instância ativa com IP público encontrada."
        exit 1
      fi

      echo "Instâncias encontradas:"
      echo "$INSTANCE_IDS"
      echo "IPs encontrados:"
      echo "$IP_ADDRESSES"

      # Exporta os IPs para serem usados nos próximos steps
      echo "EC2_IPS=$(echo "$IP_ADDRESSES" | tr '\n' ' ')" >> $GITHUB_ENV

  - name: Instalando OpenVPN
    shell: bash
    run: |
      sudo apt-get update
      sudo apt-get install openvpn -y

  - name: Configurando a VPN (se necessário)
    if: ${{ inputs.OVPN_CONFIG_FILE != '' }}
    shell: bash
    run: |
      echo "${{ inputs.OVPN_CERT_PASS }}" > vpn_pass.txt
      echo "${{ inputs.OVPN_CONFIG_FILE }}" > cicd.ovpn

      # Adiciona todas as rotas dos servidores no arquivo de configuração
      for IP in $EC2_IPS; do
        echo "route $IP 255.255.255.255" >> cicd.ovpn
      done

      echo "route-nopull" >> cicd.ovpn

      sudo openvpn --config cicd.ovpn --askpass vpn_pass.txt --daemon
      sleep 5

      # Verificação da VPN
      if ! ip address | grep -q " tun"; then
        echo "::error::Interface da VPN não encontrada!"
        exit 1
      fi

  - name: Salvando chave SSH
    shell: bash
    run: |
      echo "${{ inputs.SSH_KEY_FILE }}" > ssh_key.pem
      chmod 600 ssh_key.pem

  - name: Baixando artefato de Deploy
    uses: actions/download-artifact@v4
    with:
      name: deploy

  - name: Copiando o arquivo de Deploy para as instâncias EC2
    shell: bash
    run: |
      # Verifica se a variável EC2_IPS está definida
      if [ -z "$EC2_IPS" ]; then
        echo "Erro: Nenhum IP de instância EC2 foi fornecido."
        exit 1
      fi

      # Verifica se o arquivo deploy.tar.gz existe antes de copiar
      if [ ! -f "deploy.tar.gz" ]; then
        echo "Erro: O arquivo deploy.tar.gz não foi encontrado."
        exit 1
      fi

      # Define as opções do SCP para maior segurança e eficiência
      SCP_OPTIONS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ssh_key.pem"

      for IP in $EC2_IPS; do
        echo "Copiando deploy.tar.gz para $IP..."

        # Tenta copiar o arquivo e verifica se teve sucesso
        if scp $SCP_OPTIONS deploy.tar.gz ${{ inputs.SSH_USER }}@$IP:/tmp/; then
          echo "Arquivo copiado com sucesso para $IP."
        else
          echo "Erro ao copiar para $IP. Verifique a conexão SSH."
          exit 1
        fi
      done

      echo "Cópia finalizada para todas as instâncias EC2."

  - name: Criar lista de IPs formatada
    shell: bash
    run: |
      if [[ $(echo ${{ env.EC2_IPS }} | wc -w) -gt 1 ]]; then
        # Se houver mais de um IP, substitui espaços por vírgula
        echo "EC2_IPS_COMMA=$(echo ${{ env.EC2_IPS }} | sed 's/ /,/g')" >> $GITHUB_ENV
      else
        # Se houver apenas um IP, mantém como está
        echo "EC2_IPS_COMMA=${{ env.EC2_IPS }}" >> $GITHUB_ENV
      fi

  - name: Manipulando tag nova no manifestos
    uses: appleboy/ssh-action@master
    with:
      username: ${{ inputs.SSH_USER }}
      key_path: ssh_key.pem
      host: ${{ env.EC2_IPS_COMMA }}
      script: |
        set -e
        tar -xzf /tmp/deploy.tar.gz -C /tmp/
        export GITHUB_COMMIT=${{ env.TAG }}
        BRANCH_NAME="rc/$GITHUB_COMMIT"

        cd /home/ubuntu/log-os/

        echo "Baixando todas as branches e tags remotas..."
        git fetch --all --prune

        echo "Commitando mudanças antes de trocar para $BRANCH_NAME..."
        git config --global user.email "github-actions@github.com"
        git config --global user.name "GitHub Actions"
        git add .
        git commit -m "Atualização automática do Dockerfile antes de trocar para a branch $BRANCH_NAME" || echo "Nenhuma mudança para commit."

        if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null; then
            echo "Trocando para a branch $BRANCH_NAME..."
            git checkout "$BRANCH_NAME"
            git reset --hard origin/$BRANCH_NAME
            git pull origin "$BRANCH_NAME"
        else
            echo "Erro: A branch '$BRANCH_NAME' não existe remotamente."
            exit 1
        fi

        # Substituir :latest pela nova tag
        find /tmp/deploy -type f -name 'Dockerfile' -exec sed -i "s|:latest|:${GITHUB_COMMIT}|g" {} +

        BRANCH_NAME="${GITHUB_REF##*/}"
        TARGET_DIR="/home/ubuntu/log-os/.infra/homol"

        if [[ "$BRANCH_NAME" == "main" || "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "Branch é 'main', copiando para .infra/prod"
          TARGET_DIR="/home/ubuntu/log-os/.infra/prod"

          mkdir -p "$TARGET_DIR/php"
          mkdir -p "$TARGET_DIR/supervisor"

          mv /tmp/deploy/php/Dockerfile "$TARGET_DIR/php/Dockerfile"
          mv /tmp/deploy/php/default.conf "$TARGET_DIR/php/default.conf"
          mv /tmp/deploy/php/docker-compose.yml "$TARGET_DIR/php/docker-compose.yml"

          mv /tmp/deploy/supervisor/Dockerfile "$TARGET_DIR/supervisor/Dockerfile"
          mv /tmp/deploy/supervisor/docker-compose.yml "$TARGET_DIR/supervisor/docker-compose.yml"
          mv /tmp/deploy/supervisor/supervisord.conf "$TARGET_DIR/supervisor/supervisord.conf"

        else
          echo "Branch '$BRANCH_NAME', copiando para .infra/homol"

          mkdir -p "$TARGET_DIR/nginx"
          mkdir -p "$TARGET_DIR/php"
          mkdir -p "$TARGET_DIR/supervisor"

          mv /tmp/deploy/nginx/default.conf "$TARGET_DIR/nginx/default.conf"
          mv /tmp/deploy/php/Dockerfile "$TARGET_DIR/php/Dockerfile"
          mv /tmp/deploy/supervisor/Dockerfile "$TARGET_DIR/supervisor/Dockerfile"
          mv /tmp/deploy/supervisor/docker-compose.yml "$TARGET_DIR/supervisor/docker-compose.yml"
          mv /tmp/deploy/supervisor/supervisord.conf "$TARGET_DIR/supervisor/supervisord.conf"
        fi

  - name: Subindo nova tag
    uses: appleboy/ssh-action@master
    with:
      username: ${{ inputs.SSH_USER }}
      key_path: ssh_key.pem
      host: ${{ env.EC2_IPS_COMMA }}
      script: |
        set -e  # Encerra o script se qualquer comando falhar

        # Definir diretórios padrão para ambiente HOMOL
        ENV_PATH="/home/ubuntu/log-os/.env"
        S3_ENV_PATH="s3://logcomex-environments-files/log-os/.env.homol"
        COMPOSE_DIR="/home/ubuntu/log-os/.infra/homol"

        # Se estiver na branch main, usar ambiente PROD
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "Branch é 'main', alterando para ambiente de produção..."
          S3_ENV_PATH="s3://logcomex-environments-files/log-os/.env.prod"
          COMPOSE_DIR="/home/ubuntu/log-os/.infra/prod/php"
        fi

        echo "Baixando o arquivo de ambiente do S3..."
        if aws s3 ls "$S3_ENV_PATH" > /dev/null 2>&1; then
          aws s3 cp "$S3_ENV_PATH" "$ENV_PATH"
        else
          echo "Erro: O arquivo $S3_ENV_PATH não foi encontrado no S3."
          exit 1
        fi

        echo "Entrando no diretório da infraestrutura..."
        if [ -d "$COMPOSE_DIR" ]; then
          cd "$COMPOSE_DIR"
        else
          echo "Erro: O diretório $COMPOSE_DIR não existe."
          exit 1
        fi

        echo "Recriando os containers com Docker Compose..."
        docker-compose up -d --force-recreate

        echo "Aguardando container logos-app iniciar..."
        sleep 5  # Ajuste se necessário para garantir que o container esteja rodando

        echo "Verificando se o container logos-app está rodando..."
        if docker ps --format '{{.Names}}' | grep -q "logos-app"; then
          echo "Copiando arquivo .env para dentro do container logos-app..."
          docker cp "$ENV_PATH" logos-app:/var/www/.env
        else
          echo "Erro: O container logos-app não está rodando. Não foi possível copiar o .env."
          exit 1
        fi

        echo "Processo finalizado com sucesso."

  - name: Definir variável do nome do arquivo
    shell: bash
    run: |
      export S3_FILE="builds/build-$(date +%Y%m%d%H%M%S).tar.gz"
      echo "S3_FILE=$S3_FILE" >> $GITHUB_ENV
      echo "Nome do arquivo para upload e download: $S3_FILE"

  - name: Preparando build na instância primária e enviando para o S3
    shell: bash
    run: |
      PRIMARY_HOST=$(echo "${{ env.EC2_IPS_COMMA }}" | awk -F',' '{print $1}' | tr -d ' ')
      S3_BUCKET="log-os-publish-artifacts"

      echo "PRIMARY_HOST: $PRIMARY_HOST"
      echo "Upload para S3: s3://$S3_BUCKET/${{ env.S3_FILE }}"

      ssh -o StrictHostKeyChecking=no -i ssh_key.pem "${{ inputs.SSH_USER }}@$PRIMARY_HOST" \
      "set -e && \
      echo 'Rodando build do Node.js na instância primária ($PRIMARY_HOST)...' && \
      docker exec logos-app npm install --silent && \
      docker exec logos-app npm run build && \
      docker exec logos-app tar -czf /tmp/build.tar.gz public && \
      docker cp logos-app:/tmp/build.tar.gz /tmp/build.tar.gz && \
      echo 'Build finalizado e copiado para a instância primária.'"

      echo "Fazendo upload do build para o S3..."
      ssh -o StrictHostKeyChecking=no -i ssh_key.pem "${{ inputs.SSH_USER }}@$PRIMARY_HOST" \
      "aws s3 cp /tmp/build.tar.gz s3://$S3_BUCKET/${{ env.S3_FILE }} --acl private"

      echo "Upload para S3 concluído: s3://$S3_BUCKET/${{ env.S3_FILE }}"

  - name: Configurar permissões da chave SSH
    shell: bash
    run: chmod 600 ssh_key.pem

  - name: Distribuir build para outras instâncias
    shell: bash
    run: |
      PRIMARY_HOST=$(echo "${{ env.EC2_IPS_COMMA }}" | awk -F',' '{print $1}' | tr ',' ' ')
      OTHER_HOSTS=$(echo "${{ env.EC2_IPS_COMMA }}" | sed "s/$PRIMARY_HOST,//" | tr ',' ' ')
      S3_BUCKET="log-os-publish-artifacts"

      if [ -z "$OTHER_HOSTS" ]; then
        echo "Não há outras instâncias para copiar o build. Finalizando."
        exit 0
      fi

      echo "PRIMARY_HOST: $PRIMARY_HOST"
      echo "Outras instâncias: $OTHER_HOSTS"
      echo "Baixando do S3: s3://$S3_BUCKET/${{ env.S3_FILE }}"

      for HOST in $OTHER_HOSTS; do
        echo "Baixando build do S3 em $HOST..."
        ssh -o StrictHostKeyChecking=no -i ssh_key.pem "${{ inputs.SSH_USER }}@$HOST" \
        "aws s3 cp s3://$S3_BUCKET/${{ env.S3_FILE }} /tmp/build.tar.gz && \
        echo 'Arquivo baixado do S3.'"

        echo "Removendo arquivos antigos antes da extração..."
        ssh -o StrictHostKeyChecking=no -i ssh_key.pem "${{ inputs.SSH_USER }}@$HOST" \
        "docker exec logos-app rm -rf /var/www/public/*"

        echo "Copiando build para o contêiner logos-app em $HOST..."
        ssh -o StrictHostKeyChecking=no -i ssh_key.pem "${{ inputs.SSH_USER }}@$HOST" \
        "docker cp /tmp/build.tar.gz logos-app:/tmp/build.tar.gz && \
        docker exec logos-app tar -xzf /tmp/build.tar.gz -C /var/www/public --strip-components=1 && \
        docker exec logos-app rm /tmp/build.tar.gz && \
        docker exec logos-app chown -R www-data:www-data /var/www/public"

        echo "Build atualizado corretamente em $HOST na pasta /var/www/public!"
      done

  - name: Preparando ambiente pós new tag
    uses: appleboy/ssh-action@master
    with:
      username: ${{ inputs.SSH_USER }}
      key_path: ssh_key.pem
      host: ${{ env.EC2_IPS_COMMA }}
      script: |
        set -e

        echo "Ajustando permissões e rodando otimizações..."
        docker exec logos-app chown www-data:www-data bootstrap/cache -R

        if [ "${GITHUB_REF_NAME}" = "main" ]; then
          echo "Branch 'main' detectada. Rodando em todos os containers..."
          docker exec logos-app composer install --no-interaction --prefer-dist
          docker exec logos-reverb composer install --no-interaction --prefer-dist
          docker exec logos-supervisor composer install --no-interaction --prefer-dist
        else
          echo "Branch '${GITHUB_REF_NAME}' detectada. Rodando apenas no logos-app..."
          docker exec logos-app composer install --no-interaction --prefer-dist
        fi

        docker exec logos-app php artisan config:cache
        docker exec logos-app php artisan view:cache
        docker exec logos-app chown www-data:www-data storage -R

        echo "Processo concluído com sucesso."

  - name: Rebuild supervisor
    uses: appleboy/ssh-action@master
    with:
      username: ${{ inputs.SSH_USER }}
      key_path: ssh_key.pem
      host: ${{ env.EC2_IPS_COMMA }}
      script: |
        set -e

        # Determina o caminho com base na branch
        if [ "${GITHUB_REF_NAME}" = "main" ]; then
          COMPOSE_DIR="log-os/.infra/prod/supervisor"
          RUN_COMPOSER=true
        else
          COMPOSE_DIR="log-os/.infra/homol/supervisor"
          RUN_COMPOSER=false
        fi

        cd $COMPOSE_DIR

        if docker ps --format '{{.Names}}' | grep -q '^logos-supervisor$'; then
          echo "Container logos-supervisor encontrado."

          if [ "$RUN_COMPOSER" = true ]; then
            echo "Executando composer install..."
            docker exec logos-supervisor composer install --no-interaction --prefer-dist --optimize-autoloader
          else
            echo "Branch diferente de main. Pulando composer install."
          fi

          echo "Recriando container..."
          docker-compose up -d --force-recreate
        else
          echo "Container logos-supervisor não encontrado. Nada será feito."
        fi

  - name: Encerrando a VPN
    if: always() && inputs.OVPN_CONFIG_FILE != ''
    shell: bash
    run: |
      echo "Desconectando VPN..."
      sudo killall openvpn
      sleep 5

  - name: Criar PR para main se a branch for RC
    if: startsWith(github.ref, 'refs/heads/rc/')
    id: create-pr
    shell: bash
    run: |
      CURRENT_BRANCH=$(echo "${GITHUB_REF#refs/heads/}")
      echo "Branch atual: $CURRENT_BRANCH"

      PR_TITLE="[RC] branch $CURRENT_BRANCH to Main"
      PR_BODY="Pull Request RC to Main"

      echo "Verificando se a PR já existe..."

      EXISTING_PR=$(gh pr list --base main --head "$CURRENT_BRANCH" --json number --jq '.[0].number')

      if [[ -n "$EXISTING_PR" ]]; then
        echo "Pull Request já existe: #$EXISTING_PR"
        exit 0
      fi

      echo "Criando PR: $PR_TITLE"
      gh pr create --base="main" --head="$CURRENT_BRANCH" --title="$PR_TITLE" --body="$PR_BODY"
    env:
      GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
